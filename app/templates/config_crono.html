<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Configurar Cronograma</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/config_crono.css') }}" />
</head>
<body>
  <div id="barra-superior">
    <a id="boton-inicio" href="{{ url_for('index') }}">
      <img src="{{ url_for('static', filename='img/inicio.png') }}" alt="Inicio" />
    </a>
    <h1>Configuración del Cronograma</h1>
  </div>

  <main>
    <section id="formulario-config">
      <h2>Agregar Banda</h2>
      <form id="form-evento" method="post" action="{{ url_for('agregar_evento') }}">
        <label for="fecha">Fecha:</label>
        <input type="date" id="fecha" name="fecha" required>

        <label for="hora">Hora:</label>
        <input type="time" id="hora" name="hora" required>

        <label for="nombre">Nombre de la banda:</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="integrantes">Cantidad de integrantes:</label>
        <input type="number" id="integrantes" name="integrantes" min="1" required>

        <div class="botones-formulario">
          <button type="submit">Guardar</button>
        </div>
      </form>
    </section>

    <section id="lista-eventos">
      <h2>Eventos programados</h2>
      <div id="contenedor-eventos">
        {% for fecha in eventos|sort %}
          {% for evento in eventos[fecha] %}
            <div class="evento-item">
              <span><strong>Fecha:</strong> {{ fecha }}</span>
              <span><strong>Hora:</strong> {{ evento.hora }}</span>
              <span><strong>Banda:</strong> {{ evento.nombre }}</span>
              <span><strong>Integrantes:</strong> {{ evento.integrantes }}</span>
              <form method="post" action="{{ url_for('eliminar_evento') }}" style="display:inline;">
                <input type="hidden" name="fecha" value="{{ fecha }}">
                <input type="hidden" name="index" value="{{ loop.index0 }}">
                <button type="submit">Eliminar</button>
              </form>
              <form method="post" action="{{ url_for('editar_evento') }}" style="display:inline;">
                <input type="hidden" name="fecha_original" value="{{ fecha }}">
                <input type="hidden" name="index" value="{{ loop.index0 }}">
                <input type="date" name="fecha" value="{{ fecha }}" required>
                <input type="time" name="hora" value="{{ evento.hora }}" required>
                <input type="text" name="nombre" value="{{ evento.nombre }}" required>
                <input type="number" name="integrantes" value="{{ evento.integrantes }}" min="1" required>
                <button type="submit">Editar</button>
              </form>
            </div>
          {% endfor %}
        {% endfor %}
      </div>
    </section>
  </main>

  <footer>
    © Epsilon consultora
  </footer>
</body>
</html>
